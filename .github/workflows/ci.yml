name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    # The built-in model's packages need Swift tools 6.3 (mlx-swift), so the runner must have Xcode 26.4 or newer.
    # macos-15 only has Xcode 16: package resolution failed there (xcodebuild exit code 74).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Kit unit tests
        run: cd GrammarBuddyKit && swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app (unsigned)
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild -project GrammarBuddy.xcodeproj -scheme GrammarBuddy -configuration Debug \
            -derivedDataPath build/dd -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build | grep -E "^\*\* |: error:|error: |warning: unable|Resolve Package|Resolved source" 
