name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Kit unit tests
        run: cd GrammarBuddyKit && swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project GrammarBuddy.xcodeproj -scheme GrammarBuddy -configuration Debug \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build
